disabled_rules:
  - todo

opt_in_rules:
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - modifier_order
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

included:
  - Cruftless
  - CruftlessCore

excluded:
  - .build
  - CruftlessCore/.build
  - DerivedData

line_length:
  warning: 140
  error: 180

file_length:
  warning: 500
  error: 600

custom_rules:
  no_raw_removeitem:
    name: "Raw removeItem forbidden"
    regex: 'FileManager(\.default)?\.removeItem'
    match_kinds:
      - identifier
    included:
      - ".*\\.swift"
    excluded:
      - ".*/Safety/DeletionExecutor\\.swift"
    message: "FileManager.removeItem may only be called inside CruftlessCore/Safety/DeletionExecutor.swift protected by PathGuard."
    severity: error
  no_raw_posix_delete:
    name: "Raw POSIX delete forbidden"
    regex: '\b(unlink|rmdir|removefile|trashItem)\s*\('
    included:
      - ".*\\.swift"
    excluded:
      - ".*/Safety/DeletionExecutor\\.swift"
      - ".*/Tests/CruftlessCoreTests/Support/TestFileSystem\\.swift"
    message: "Deletion primitives may only be called inside DeletionExecutor.swift (guarded) or the test-only TestFileSystem helper."
    severity: error
