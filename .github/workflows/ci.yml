name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Xcode and Swift toolchain
        run: |
          xcodebuild -version
          swift --version
          test "$(xcodebuild -version | awk 'NR == 1 { print $2 }')" = "27.0"
          swift --version | grep -Eq 'Swift version 6\.4(\.| )'

      - name: Lint
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint version
          swiftlint --strict

      - name: Test core package
        run: swift test --package-path CruftlessCore

      - name: Test release cut helper
        run: bash scripts/release/tests/cut-test.sh

      - name: Verify app release metadata
        run: |
          settings="$(xcodebuild -project Cruftless/Cruftless.xcodeproj -scheme Cruftless -configuration Release -showBuildSettings)"
          app_version="$(printf '%s\n' "$settings" | awk -F' = ' '/^[[:space:]]+MARKETING_VERSION = / { print $2; exit }')"
          app_build="$(printf '%s\n' "$settings" | awk -F' = ' '/^[[:space:]]+CURRENT_PROJECT_VERSION = / { print $2; exit }')"
          config_version="$(sed -nE 's/^MARKETING_VERSION[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' Cruftless/Version.xcconfig)"
          config_build="$(sed -nE 's/^CURRENT_PROJECT_VERSION[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' Cruftless/Version.xcconfig)"
          test "$app_version" = "$config_version"
          test "$app_build" = "$config_build"

      - name: Build unsigned app
        run: >-
          xcodebuild
          -project Cruftless/Cruftless.xcodeproj
          -scheme Cruftless
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Check working tree
        run: |
          git diff --check
          git diff --exit-code
